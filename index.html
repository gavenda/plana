<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121318" />
    <!-- Paint the dark surface before any stylesheet arrives, so the first frame isn't white.
         Keep in step with --color-surface and --color-on-surface in src/assets/main.css. -->
    <meta name="color-scheme" content="dark" />
    <style>
      html {
        background-color: #121318;
        color: #e3e1e9;
        color-scheme: dark;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Roboto+Mono:wght@400..500&display=swap"
    />
    <!-- Only the icons the dashboard uses. Keep icon_names sorted alphabetically. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=add,arrow_back,arrow_downward,arrow_drop_down,arrow_upward,assignment_late,assignment_turned_in,backup,badge,block,cake,calendar_today,campaign,celebration,check,chevron_left,chevron_right,close,cloud_done,cloud_off,cloud_sync,content_copy,dashboard,data_object,delete,delete_sweep,edit,error,expand_less,expand_more,gavel,group,headset_mic,history,horizontal_rule,hourglass_top,how_to_reg,image,info,link,login,logout,menu,menu_open,music_note,notes,open_in_new,pause,photo_library,play_arrow,refresh,save,search,send,settings,smart_button,sports_esports,summarize,text_fields,view_agenda,volume_up,web_asset,widgets&display=block"
    />
    <!-- The title is injected per route by the SSR renderer. -->
    <!--app-head-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <!--app-state-->
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
