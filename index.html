<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121318" />
    <!-- Paint the dark surface before any stylesheet arrives, so the first frame isn't white.
         Keep in step with --color-surface and --color-on-surface in src/assets/main.css. -->
    <meta name="color-scheme" content="dark" />
    <style>
      html {
        background-color: #121318;
        color: #e3e1e9;
        color-scheme: dark;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Roboto+Mono:wght@400..500&display=swap"
    />
    <!-- Only the icons the dashboard uses. Keep icon_names sorted alphabetically. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=arrow_drop_down,badge,cake,calendar_today,campaign,check,chevron_left,chevron_right,close,dashboard,delete,delete_sweep,edit,gavel,headset_mic,history,hourglass_top,how_to_reg,logout,menu,menu_open,music_note,refresh,search,settings,sports_esports&display=block"
    />
    <!-- The title is injected per route by the SSR renderer. -->
    <!--app-head-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <!--app-state-->
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
